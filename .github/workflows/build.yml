name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]          # pushing a tag like v0.1.0 also creates a GitHub Release
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # WPF only builds on Windows, so this can't run on a Linux runner.
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Tagged builds (v0.2.0) get that number; others are 0.1.0. The program needs its real version number to know
      # whether an update is newer than itself.
      - name: Work out the version number
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "Version: $version"

      # A release must not go out with the license's blanks unfilled.
      - name: Check the license is complete
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (Select-String -Path LICENSE.txt -Pattern '\[\[FILL IN') { throw "LICENSE.txt still has [[FILL IN: ...]] blanks. Fill them in before releasing." }

      - name: Restore
        run: dotnet restore ReceiptCapture.sln

      - name: Build
        run: dotnet build ReceiptCapture.sln -c Release --no-restore

      - name: Run tests
        run: dotnet run --project ReceiptCapture.Tests -c Release --no-build

      - name: Publish app
        run: >
          dotnet publish ReceiptCapture/ReceiptCapture.csproj
          -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }}
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # Copies Whisper's native engine DLLs next to the exe and stops the build if any are missing.
      - name: Add speech engine files
        shell: pwsh
        run: ./tools/add-speech-engine.ps1 -PublishDir publish

      # The speech model is a ~180 MB file. It is cached between runs so it is only downloaded once.
      - name: Restore speech model from cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model-cache
          key: whisper-model-ggml-small.en-q5_1-v1

      - name: Download speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force model-cache | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin" `
            -OutFile "model-cache/ggml-small.en-q5_1.bin" -MaximumRetryCount 3 -RetryIntervalSec 10

      - name: Add speech model and engine files to the app folder
        shell: pwsh
        run: |
          $model = "model-cache/ggml-small.en-q5_1.bin"
          $size = (Get-Item $model).Length
          if ($size -lt 180MB -or $size -gt 200MB) { throw "Speech model has an unexpected size ($size bytes); the download may have failed." }
          $hash = (Get-FileHash $model -Algorithm SHA1).Hash
          if ($hash -ne "20F54878D608F94E4A8EE3AE56016571D47CBA34") { Write-Warning "Speech model SHA-1 is $hash, which differs from the value published by whisper.cpp." }

          New-Item -ItemType Directory -Force publish/models | Out-Null
          Copy-Item $model publish/models/

          # The speech engine needs Microsoft's Visual C++ runtime. Ship its DLLs beside the engine so a client PC
          # that has never installed it still works.
          $redist = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64" -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($redist) {
            $sources = Get-ChildItem $redist.FullName -Directory | Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|OpenMP)$' }
            foreach ($target in @('publish', 'publish/runtimes/win-x64', 'publish/runtimes/noavx/win-x64')) {
              if (Test-Path $target) { foreach ($source in $sources) { Copy-Item "$($source.FullName)\*.dll" $target -Force } }
            }
          } else {
            Write-Warning "Visual C++ runtime DLLs were not found on the build machine."
          }

          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "App folder: $([math]::Round($_.Sum / 1MB)) MB" }

      - name: Upload portable app folder
        uses: actions/upload-artifact@v4
        with:
          name: AegisDocs-portable
          path: publish
          if-no-files-found: error

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\AegisDocs.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AegisDocs-Setup
          path: installer-output/AegisDocs-Setup-*.exe
          if-no-files-found: error

      # Signs the update information (latest.json) that installed copies check. Needs the UPDATE_SIGNING_KEY secret and
      # the UPDATE_BASE_URL variable (see README, "Updates"); without them this step is skipped.
      - name: Sign update information
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY -or -not $env:UPDATE_BASE_URL) {
            Write-Warning "Update signing isn't set up (needs the UPDATE_SIGNING_KEY secret and the UPDATE_BASE_URL variable), so no latest.json was made."
            exit 0
          }
          $installer = Get-ChildItem installer-output/AegisDocs-Setup-*.exe | Select-Object -First 1
          $url = "$($env:UPDATE_BASE_URL.TrimEnd('/'))/$($installer.Name)"
          New-Item -ItemType Directory -Force update-output | Out-Null
          dotnet run --project tools/UpdateSigner -c Release -- sign --installer $installer.FullName --version $env:APP_VERSION --url $url --out update-output/latest.json
          if ($LASTEXITCODE -ne 0) { throw "Signing the update information failed" }

      - name: Upload signed update information
        uses: actions/upload-artifact@v4
        with:
          name: AegisDocs-update
          path: update-output/latest.json
          if-no-files-found: ignore

  release:
    # Only runs when you push a version tag (e.g. v0.1.0).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to create the release
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: AegisDocs-Setup

      - name: Download signed update information
        continue-on-error: true      # absent until update signing is set up
        uses: actions/download-artifact@v4
        with:
          name: AegisDocs-update

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AegisDocs-Setup-*.exe
            latest.json
          generate_release_notes: true
